<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>The Imitation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="gallery" aria-label="Six CSS image examples">
      <figure class="artwork penguin-artwork">
        <img src="assets/penguins.jpg" alt="A group of emperor penguins standing in the snow">
      </figure>
      <figure class="artwork field-artwork">
        <img src="assets/football_field.jpg" alt="A grayscale football field framed by a tic-tac-toe pattern">
      </figure>
      <figure class="artwork dinosaur-artwork">
        <img src="assets/dinosaur.png" alt="A blue cartoon dinosaur">
      </figure>
      <figure class="artwork seagull-artwork">
        <img src="assets/seagull.png" alt="A seagull in flight against a blue-violet background">
      </figure>
      <figure class="artwork butterfly-artwork">
        <img src="assets/butterfly.jpg" alt="An inverted-color butterfly with outstretched wings">
      </figure>
      <figure class="artwork theater-scene">
        <img src="assets/theater_stage.jpg" alt="A theater stage with red curtains, spotlights, and rows of seats">
        <span class="presenting">Presenting</span>
      </figure>
    </section>
  </main>
</body>
</html>
